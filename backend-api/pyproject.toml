[project]
name = "sc-api"
version = "0.1.0"
description = "Smart-Clearance's platform API: the landing page's and the staff console's backend."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.20,<1.21",
    "firebase-admin>=7.7,<7.8",
    "google-auth>=2.40",
    "google-cloud-secret-manager>=2.31,<2.32",
    "cloud-sql-python-connector[asyncpg]>=1.22,<1.23",
    "slowapi>=0.1.10,<0.2",
    "faker>=40.41,<41",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1,<1.46",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<0.67",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1,<0.67",
    "opentelemetry-instrumentation-requests>=0.66b1,<0.67",
    "google-cloud-pubsub>=2.42,<2.43",
    "google-cloud-storage>=3.16,<3.17",
]

[project.scripts]
sc-admin = "sc_api.cli.admin:main"
sc-hydrate = "sc_api.cli.hydrate:main"
sc-walk = "sc_api.cli.walk:main"

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17",
    "pytest>=9.1,<9.2",
    "pytest-asyncio>=1.4,<1.5",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
# S105/S106 read "password_state" as a password; gitleaks scans for real ones (CI)
ignore = ["S101", "S105", "S106", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311", "S608"]
# seeded randomness on purpose: the same seed builds the same synthetic world
"src/sc_api/domain/clock.py" = ["S311"]
"src/sc_api/cli/*.py" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
