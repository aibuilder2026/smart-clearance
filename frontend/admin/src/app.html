<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f2f6f3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#070b09" media="(prefers-color-scheme: dark)" />
		<script>
			// the reader's appearance before the first paint, so a dark page never flashes light (sc3-theme, as the prototype)
			(function () {
				var mode = null;
				try {
					mode = localStorage.getItem('sc3-theme');
				} catch (e) {}
				var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
