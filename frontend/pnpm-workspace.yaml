packages:
  - core
  - api
  - admin
  - console
  - workspace
  - demo
  - testing

# install scripts this workspace never runs: firebase's (@firebase/util writes Firebase App Hosting's auto-init defaults;
# the console passes its config explicitly) and protobufjs's (a check for its own CLI). Denied here, so CI's install,
# which refuses any script nobody decided about, passes.
allowBuilds:
  '@firebase/util': false
  protobufjs: false

# one version of each shared dependency across the workspace; packages refer to these as "catalog:"
catalog:
  svelte: ^5.57.1
  typescript: ~6.0.3
  vite: ^8.3.2
  vitest: ^5.0.3
  svelte-check: ^4.7.6
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@testing-library/svelte': ^5.4.2
  jsdom: ^30.1.1
  bits-ui: ^2.19.5
  '@internationalized/date': ^3.12.4
  '@lucide/svelte': ^1.51.0
  motion: ^14.0.0
  '@types/node': ^24.0.0
