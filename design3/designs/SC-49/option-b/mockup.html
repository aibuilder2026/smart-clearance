<title>SC-49 Option B · the fill</title>
<meta name="description" content="The console's motion, option B: the screen's shape fills with ink while it loads, Sign in fills and floods into the console, charts fill like water and the agents' stops are vessels that batches drop between. Every company, person and figure is fictional and illustrative.">
<meta name="robots" content="noindex">
<script>
  // every load starts from the seed (plus the review's clients), signed out unless ?signed=1; ?theme= from the board
  (function () {
    var p = new URLSearchParams(location.search), q = p.get("theme");
    try {
      localStorage.removeItem("sc3-platform");
      if (p.get("signed") === "1") localStorage.setItem("sc3-console-session", JSON.stringify({ uid: "neha", at: Date.now() }));
      else localStorage.removeItem("sc3-console-session");
      if (p.get("paused") !== "1") localStorage.removeItem("sc3-console-live");
      if (q === "dark" || q === "light") localStorage.setItem("sc3-theme", q);
    } catch (e) {}
    var mode = q; try { mode = localStorage.getItem("sc3-theme") || q; } catch (e) {}
    var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
  window.SC3_IMG = "../../../system/img/"; window.SC3_SITE_IMG = "../../../site/assets/plates/";
  window.SC3_LINKS = { site: "../../../site/Smart-Clearance%20site%20v3.html", app: "../../../app/Smart-Clearance%20app%20v3.html", demo: "../../../demo/Smart-Clearance%20demo%20v3.html" };
</script>
