<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-219 · under the hood, cut 10</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root {
    --bg: #050806; --ink: #ecf3ef; --ink2: #aabcb2; --ink3: #7a8c82; --g300: #73c99d; --g400: #3fb07b; --ring: #34d380;
    --amber: #f2b437; --amber2: #f7c04a; --red: #e55c4a; --blue: #8ab4f8; --blue2: #c9dcff; --violet: #c58af9; --orange: #ff9f45;
    --bar: 138px;
  }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #labels, #ui, #lead { position: absolute; inset: 0; pointer-events: none; }
  #lead { overflow: visible; }

  /* small labels at a part's place, sized by its depth */
  .node { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 9px 17px 9px 9px;
    border-radius: 17px; background: linear-gradient(180deg, rgba(16, 26, 21, 0.9), rgba(8, 14, 11, 0.9));
    border: 1.2px solid rgba(115, 201, 157, 0.28); white-space: nowrap; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55); opacity: 0; }
  .node .tile { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none;
    background: rgba(52, 211, 128, 0.12); color: var(--g300); border: 1px solid rgba(115, 201, 157, 0.25); }
  .node .tile svg { width: 20px; height: 20px; }
  .node b { display: block; font: 700 21px/1.05 'Bricolage Grotesque'; letter-spacing: -0.2px; color: var(--ink); }
  .node span { display: block; margin-top: 4px; font: 500 14.5px/1.15 'Geist'; color: var(--ink2); }
  .node.gcp .tile { background: rgba(138, 180, 248, 0.14); color: var(--blue2); border-color: rgba(138, 180, 248, 0.38); }
  .node.fire .tile { background: rgba(255, 159, 69, 0.14); color: #ffb470; border-color: rgba(255, 159, 69, 0.38); }

  .agent { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 160px; opacity: 0; }
  .agent b { font: 650 21px/1 'Geist'; color: var(--ink); letter-spacing: -0.2px; padding: 6px 12px; border-radius: 10px;
    background: rgba(6, 11, 9, 0.84); border: 1px solid rgba(115, 201, 157, 0.22); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9); }
  .agent .tier { font: 700 15px/1 'Geist'; padding: 6px 10px; border-radius: 999px; white-space: nowrap; opacity: 0; display: flex; gap: 6px; align-items: center; }
  .agent .tier svg { width: 14px; height: 14px; }
  .tier.pro { background: rgba(40, 24, 56, 0.95); border: 1.5px solid rgba(197, 138, 249, 0.85); color: #ead9ff; }
  .tier.flash { background: rgba(14, 26, 48, 0.95); border: 1.5px solid rgba(138, 180, 248, 0.85); color: var(--blue2); }
  .tier.rules { background: rgba(14, 26, 20, 0.95); border: 1.5px solid rgba(115, 201, 157, 0.7); color: var(--g300); }

  .topic { position: absolute; left: 0; top: 0; font: 600 17px/1 ui-monospace, 'SF Mono', Menlo, monospace; padding: 8px 12px; border-radius: 10px;
    background: rgba(7, 14, 11, 0.92); border: 1.4px solid rgba(115, 201, 157, 0.55); color: #bdf5d6; white-space: nowrap; opacity: 0; }
  .pill { position: absolute; left: 0; top: 0; display: flex; gap: 8px; align-items: center; font: 650 16px/1 'Geist'; padding: 8px 13px; border-radius: 999px;
    white-space: nowrap; opacity: 0; background: rgba(7, 13, 10, 0.92); border: 1.2px solid rgba(115, 201, 157, 0.4); color: #cfe9db; }
  .pill svg { width: 16px; height: 16px; color: var(--g300); }
  .pill.blue { border-color: rgba(138, 180, 248, 0.55); color: #c9dcff; } .pill.blue svg { color: var(--blue); }
  .pill.big { font-size: 19px; padding: 10px 16px; gap: 9px; } .pill.big svg { width: 19px; height: 19px; }

  /* the hero callout: the part the voice names, large, beside it, with a leader to it */
  .hero { position: absolute; left: 0; top: 0; width: 540px; padding: 20px 24px 20px 20px; border-radius: 20px; opacity: 0;
    background: linear-gradient(180deg, rgba(12, 22, 17, 0.86), rgba(6, 12, 9, 0.86)); border: 1.3px solid rgba(115, 201, 157, 0.36);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
  .hero .row { display: flex; gap: 16px; align-items: center; }
  .hero .tile { width: 60px; height: 60px; border-radius: 16px; display: grid; place-items: center; flex: none;
    background: rgba(52, 211, 128, 0.14); color: #9ff0c4; border: 1px solid rgba(115, 201, 157, 0.36); }
  .hero .tile svg { width: 30px; height: 30px; }
  .hero .k { font: 700 13.5px/1 'Geist'; letter-spacing: 2.6px; text-transform: uppercase; color: var(--g300); }
  .hero h2 { margin: 7px 0 0; font: 700 40px/1.02 'Bricolage Grotesque'; letter-spacing: -0.8px; color: var(--ink); white-space: nowrap; }
  .hero h2 .c { display: inline-block; }
  .hero .s { margin-top: 14px; font: 500 19px/1.32 'Geist'; color: var(--ink2); }
  .hero .chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .hero .chips span { font: 600 14.5px/1 ui-monospace, 'SF Mono', Menlo, monospace; padding: 7px 10px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cfe2d8; white-space: nowrap; }
  .hero.blue { border-color: rgba(138, 180, 248, 0.45); } .hero.blue .tile { background: rgba(138, 180, 248, 0.15); color: var(--blue2); border-color: rgba(138, 180, 248, 0.45); } .hero.blue .k { color: var(--blue); }
  .hero.fire { border-color: rgba(255, 159, 69, 0.45); } .hero.fire .tile { background: rgba(255, 159, 69, 0.15); color: #ffc58e; border-color: rgba(255, 159, 69, 0.45); } .hero.fire .k { color: #ffb470; }
  .hero.violet { border-color: rgba(197, 138, 249, 0.55); } .hero.violet .tile { background: linear-gradient(135deg, rgba(138, 180, 248, 0.2), rgba(197, 138, 249, 0.26)); color: #ead9ff; border-color: rgba(197, 138, 249, 0.55); } .hero.violet .k { color: #d4adff; }
  .hero.amber { border-color: rgba(247, 192, 74, 0.55); } .hero.amber .tile { background: rgba(247, 192, 74, 0.16); color: #ffd98a; border-color: rgba(247, 192, 74, 0.55); } .hero.amber .k { color: var(--amber2); }
  .hero .fig { margin-top: 10px; font: 700 64px/1 'Bricolage Grotesque'; letter-spacing: -1.4px; color: #c9f7de; font-variant-numeric: tabular-nums; }

  /* the letterbox: 2.39:1, the act's title in the top bar, the stack's parts in the bottom bar */
  .bar { position: absolute; left: 0; width: 1920px; height: var(--bar); background: #000; z-index: 20; }
  #barT { top: 0; } #barB { bottom: 0; }
  .ttl { position: absolute; left: 76px; top: 34px; z-index: 21; opacity: 0; }
  .ttl .k { font: 700 14px/1 'Geist'; letter-spacing: 3.2px; text-transform: uppercase; color: var(--g300); display: flex; gap: 12px; align-items: center; }
  .ttl .k i { width: 8px; height: 8px; border-radius: 50%; background: var(--ring); }
  .ttl .k em { font-style: normal; color: var(--ink3); letter-spacing: 2px; }
  .ttl h1 { margin: 12px 0 0; font: 700 44px/1 'Bricolage Grotesque'; letter-spacing: -0.9px; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .ttl h1 .w { display: inline-block; }
  #index { position: absolute; left: 0; right: 0; bottom: 38px; z-index: 21; display: flex; justify-content: center; gap: 10px; opacity: 0; }
  .ix { display: flex; align-items: center; gap: 8px; padding: 9px 14px 9px 10px; border-radius: 999px; font: 600 16px/1 'Geist';
    color: #5f6f67; border: 1px solid rgba(255, 255, 255, 0.07); background: rgba(255, 255, 255, 0.02); white-space: nowrap; }
  .ix svg { width: 17px; height: 17px; }
  .ix.done { color: #9fb7aa; border-color: rgba(115, 201, 157, 0.22); }
  .ix.on { color: #eafff2; border-color: rgba(52, 211, 128, 0.85); background: rgba(52, 211, 128, 0.16); }
  .ix.on svg { color: var(--ring); }

  .cursor { position: absolute; left: 0; top: 0; z-index: 30; width: 36px; height: 36px; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6)); }
  .ripple { position: absolute; left: 0; top: 0; z-index: 12; border-radius: 50%; border: 3px solid var(--amber2); opacity: 0; }
  .ripple.r2 { border-color: rgba(247, 192, 74, 0.6); border-width: 2px; }
  .lockchip { position: absolute; left: 0; top: 0; display: flex; gap: 12px; align-items: center; padding: 12px 20px 12px 12px; border-radius: 999px;
    background: rgba(32, 12, 10, 0.94); border: 1.5px solid rgba(229, 92, 74, 0.65); color: #ffd0c8; font: 650 20px/1 'Geist'; opacity: 0; white-space: nowrap;
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55); }
  .lockchip .bi { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(229, 92, 74, 0.2); color: #ff9c8c; }
  .lockchip svg { width: 19px; height: 19px; }
</style>
