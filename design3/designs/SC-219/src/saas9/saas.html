<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-219 · agentic software as a service</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root { --bg: #050806; --ink: #ecf3ef; --ink2: #aabcb2; --ink3: #7a8c82; --g300: #73c99d; --ring: #34d380; --amber: #f7c04a; --red: #e55c4a; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  /* the room: the distributor's godown, out of focus and graded down, so the words own the frame */
  #bg { position: absolute; left: -60px; top: -40px; width: 2040px; height: 1160px; background: url('bg.webp') center / cover;
    filter: blur(16px) saturate(0.7) brightness(0.42); transform-origin: 50% 45%; }
  #grade { position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 38%, rgba(10, 22, 16, 0.18) 0%, rgba(4, 8, 6, 0.72) 70%, rgba(3, 5, 4, 0.92) 100%); }
  #light { position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0; }
  canvas { position: absolute; left: 0; top: 0; }

  /* the mark and the name, then the line */
  #brand { position: absolute; left: 0; top: 0; width: 1920px; display: flex; flex-direction: column; align-items: center; transform-origin: 50% 0%; }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .lockup img { width: 96px; height: 96px; border-radius: 26px; }
  .lockup b { font: 700 88px/1 'Bricolage Grotesque'; letter-spacing: -2px; }
  .turns { margin-top: 18px; font: 500 34px/1.2 'Geist'; color: var(--ink2); }
  .turns s { text-decoration-thickness: 3px; text-decoration-color: rgba(229, 92, 74, 0.9); color: #e9a89d; }
  .turns em { font-style: normal; color: #9ff0c4; }
  #fig { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; }
  #fig .v { font: 700 112px/1 'Bricolage Grotesque'; letter-spacing: -3px; font-variant-numeric: tabular-nums; }
  #fig .l { margin-top: 12px; font: 600 26px/1 'Geist'; color: var(--ink2); }
  #fig .chip { display: inline-flex; gap: 10px; align-items: center; margin-top: 22px; padding: 12px 20px; border-radius: 999px; font: 650 24px/1 'Geist';
    background: rgba(10, 30, 20, 0.85); border: 1.5px solid rgba(115, 201, 157, 0.55); color: #c9f7de; }
  #fig .chip svg { width: 24px; height: 24px; color: var(--ring); }
  .kicker { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; font: 700 17px/1 'Geist'; letter-spacing: 4px; text-transform: uppercase; color: var(--g300); }
  .kicker i { display: inline-block; width: 9px; height: 9px; margin: 0 12px 2px; border-radius: 50%; background: var(--ring); vertical-align: middle; }
  #head { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; font: 700 58px/1.05 'Bricolage Grotesque'; letter-spacing: -1.3px; }
  #head .w { display: inline-block; }

  /* the tenants: each brand on its own address */
  #tenants { position: absolute; left: 0; top: 0; width: 1920px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  #tenants .ten.tag { flex-basis: 100%; justify-content: center; margin-bottom: 2px; }
  .ten { display: flex; gap: 9px; align-items: center; padding: 8px 14px 8px 8px; border-radius: 999px; font: 600 16px/1 'Geist'; white-space: nowrap;
    background: rgba(8, 14, 11, 0.86); border: 1px solid rgba(255, 255, 255, 0.14); color: #dcebe3; opacity: 0; }
  .ten .m { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 800 15px/1 'Bricolage Grotesque'; color: #fff; }
  .ten svg { width: 15px; height: 15px; color: var(--g300); }
  .ten.tag { background: none; border: none; color: var(--g300); font: 700 15px/1 'Geist'; letter-spacing: 2.6px; text-transform: uppercase; padding-left: 0; }

  /* the three tiers of the supply chain */
  .card { position: absolute; left: 0; top: 0; width: 520px; border-radius: 26px; overflow: hidden; opacity: 0;
    background: rgba(10, 16, 13, 0.92); border: 1.5px solid rgba(255, 255, 255, 0.13); box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6); }
  .card .ph { position: relative; width: 520px; height: 410px; overflow: hidden; }
  .card .ph img { position: absolute; left: 0; top: 0; width: 520px; height: 410px; object-fit: cover; transform-origin: 50% 45%; }
  .card .ph .sheen { position: absolute; top: -20%; width: 34%; height: 140%; transform: rotate(14deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.22), rgba(255,255,255,0)); opacity: 0; }
  .card .ph .shade { position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(180deg, rgba(5,9,7,0) 0%, rgba(5,9,7,0.82) 100%); }
  .card .tier { position: absolute; left: 22px; bottom: 18px; font: 700 15px/1 'Geist'; letter-spacing: 2.6px; text-transform: uppercase; color: #bdf5d6;
    display: flex; gap: 10px; align-items: center; }
  .card .tier .n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: rgba(52, 211, 128, 0.22); color: #c9f7de; font-size: 14px; letter-spacing: 0; }
  .card .cap { padding: 18px 22px 22px; }
  .card .cap b { display: block; font: 700 32px/1.05 'Bricolage Grotesque'; letter-spacing: -0.5px; }
  .card .cap span { display: block; margin-top: 8px; font: 500 19px/1.3 'Geist'; color: var(--ink2); }
  .card .cap .ag { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card .cap .ag i { font-style: normal; display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 999px; font: 600 14px/1 'Geist';
    background: rgba(52, 211, 128, 0.10); border: 1px solid rgba(115, 201, 157, 0.35); color: #cfe9db; opacity: 0; }
  .card .cap .ag i svg { width: 13px; height: 13px; color: var(--g300); }

  /* the route that joins them, and the agents riding it */
  #route { position: absolute; left: 0; top: 0; overflow: visible; }
  .bot { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 13px; display: grid; place-items: center;
    background: rgba(9, 17, 13, 0.95); border: 1.5px solid rgba(115, 201, 157, 0.6); color: #c9f7de; opacity: 0; }
  .bot svg { width: 22px; height: 22px; }
  .agents { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; font: 700 15px/1 'Geist'; letter-spacing: 2.6px; text-transform: uppercase; color: var(--g300); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grade"></div>
  <canvas id="light" width="1920" height="1080"></canvas>
  <svg id="route" width="1920" height="1080"></svg>
  <div id="ui"></div>
</div>
<script src="icons.js"></script>
<script src="saas.js"></script>
</body>
</html>
