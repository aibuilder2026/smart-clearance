<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-219 · the live demo: one imaginary brand, two batches, two distributors</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root { --bg: #050806; --ink: #ecf3ef; --ink2: #aabcb2; --ink3: #7a8c82; --g300: #73c99d; --ring: #34d380; --amber: #f7c04a; --red: #e55c4a; --blue2: #c9dcff; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  /* the bay at dawn where the story starts, out of focus and graded down */
  #bg { position: absolute; left: -60px; top: -40px; width: 2040px; height: 1160px; background: url('bg.webp') center / cover;
    filter: blur(18px) saturate(0.75) brightness(0.34); transform-origin: 40% 40%; }
  #grade { position: absolute; inset: 0; background: radial-gradient(130% 100% at 30% 35%, rgba(14, 24, 18, 0.1) 0%, rgba(4, 8, 6, 0.72) 70%, rgba(3, 5, 4, 0.94) 100%); }
  #world { position: absolute; inset: 0; transform-origin: 0 0; }
  #lines { position: absolute; left: 0; top: 0; overflow: visible; }
  #ui { position: absolute; inset: 0; }

  .hdr { position: absolute; left: 80px; top: 60px; }
  .hdr .k { font: 700 16px/1 'Geist'; letter-spacing: 3px; text-transform: uppercase; color: var(--g300); display: flex; gap: 12px; align-items: center; opacity: 0; }
  .hdr .k i { width: 9px; height: 9px; border-radius: 50%; background: var(--ring); }
  .hdr h1 { margin: 14px 0 0; font: 700 58px/1.02 'Bricolage Grotesque'; letter-spacing: -1.3px; white-space: nowrap; }
  .hdr h1 .w { display: inline-block; opacity: 0; }
  .hdr h1 .a { color: #9ff0c4; } .hdr h1 .b { color: #ffd98a; }
  .live { position: absolute; right: 80px; top: 66px; display: flex; gap: 10px; align-items: center; padding: 11px 18px; border-radius: 999px; opacity: 0;
    font: 700 16px/1 'Geist'; letter-spacing: 2.2px; text-transform: uppercase; background: rgba(8, 14, 11, 0.88); border: 1.5px solid rgba(229, 92, 74, 0.55); color: #ffd6cf; }
  .live b { width: 10px; height: 10px; border-radius: 50%; background: #ff5a47; }
  .live span { color: var(--ink2); letter-spacing: 1.4px; }
  /* before the brand: the words the voice opens on, large, then into the corner badge */
  .lhero { position: absolute; left: 0; top: 0; width: 1920px; text-align: center; opacity: 0; z-index: 8; }
  .lhero h2 { margin: 0; display: inline-flex; gap: 26px; align-items: center; font: 700 104px/1 'Bricolage Grotesque'; letter-spacing: -2.4px; color: var(--ink); }
  .lhero h2 b { width: 30px; height: 30px; border-radius: 50%; background: #ff5a47; }
  .lhero p { margin: 24px 0 0; font: 600 24px/1.2 'Geist'; letter-spacing: 3px; text-transform: uppercase; color: var(--ink2); }

  .card { position: absolute; left: 0; top: 0; border-radius: 22px; opacity: 0; transform-origin: 0 0;
    background: linear-gradient(180deg, rgba(14, 24, 19, 0.92), rgba(7, 12, 10, 0.92)); border: 1.3px solid rgba(115, 201, 157, 0.32);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05); }
  .k2 { font: 700 13px/1 'Geist'; letter-spacing: 2.4px; text-transform: uppercase; color: var(--g300); }

  /* the brand */
  .brand { width: 400px; overflow: hidden; }
  .brand .ph { position: relative; height: 226px; overflow: hidden; }
  .brand .ph img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.9); }
  .brand .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(7, 12, 10, 0.92) 100%); }
  .brand .tx { padding: 2px 22px 20px; margin-top: -40px; position: relative; }
  .brand h2 { margin: 8px 0 0; font: 700 42px/1 'Bricolage Grotesque'; letter-spacing: -0.9px; }
  .brand .s { margin-top: 9px; font: 500 17px/1.3 'Geist'; color: var(--ink2); }
  .brand .who { margin-top: 14px; display: flex; gap: 10px; align-items: center; font: 600 15px/1.2 'Geist'; color: #d6e6dd; }
  .brand .who img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; border: 1.5px solid rgba(115, 201, 157, 0.6); }
  .brand .who span { display: block; font: 500 13.5px/1.2 'Geist'; color: var(--ink2); margin-top: 2px; }
  .brand .url { margin-top: 12px; display: inline-flex; gap: 8px; align-items: center; font: 600 14px/1 ui-monospace, 'SF Mono', Menlo, monospace; padding: 8px 11px;
    border-radius: 9px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cfe2d8; }
  .brand .url svg { width: 15px; height: 15px; color: var(--g300); }
  .stamp { position: absolute; left: 0; top: 0; z-index: 5; padding: 10px 16px; border-radius: 10px; opacity: 0; white-space: nowrap;
    font: 800 21px/1 'Geist'; letter-spacing: 2.6px; text-transform: uppercase; color: #ffd98a; border: 3px solid #f7c04a;
    background: rgba(40, 28, 6, 0.86); }
  .stamp small { display: block; margin-top: 6px; font: 600 13px/1 'Geist'; letter-spacing: 1.6px; color: #e9c983; }

  /* a batch, a distributor, a path */
  .batch { width: 344px; padding: 16px 18px 16px 14px; display: flex; gap: 14px; align-items: center; }
  .batch img { width: 92px; height: 92px; flex: none; object-fit: contain; filter: drop-shadow(0 14px 20px rgba(0,0,0,0.6)); }
  .batch b { display: block; margin-top: 7px; font: 700 22px/1.1 'Bricolage Grotesque'; letter-spacing: -0.3px; }
  .batch span { display: block; margin-top: 6px; font: 500 14.5px/1.3 'Geist'; color: var(--ink2); }
  .batch .risk { margin-top: 8px; display: inline-block; padding: 5px 9px; border-radius: 8px; font: 650 13.5px/1 'Geist'; background: rgba(229, 92, 74, 0.14); border: 1px solid rgba(229, 92, 74, 0.5); color: #ffc2b8; }
  .dist { width: 344px; padding: 16px 18px 16px 16px; display: flex; gap: 14px; align-items: center; }
  .dist img { width: 84px; height: 84px; flex: none; border-radius: 20px; object-fit: cover; border: 2px solid rgba(115, 201, 157, 0.65); }
  .dist.sad img { border-color: rgba(247, 192, 74, 0.7); }
  .dist b { display: block; margin-top: 7px; font: 700 22px/1.1 'Bricolage Grotesque'; letter-spacing: -0.3px; }
  .dist span { display: block; margin-top: 6px; font: 500 14.5px/1.3 'Geist'; color: var(--ink2); }
  .card.happy { border-color: rgba(115, 201, 157, 0.5); } .card.sad { border-color: rgba(247, 192, 74, 0.5); }
  /* cut 15: the people under the brand: Munchly's own in the brand's green, the platform's in Google's blue */
  .person { width: 368px; } .person img { width: 76px; height: 76px; border-radius: 18px; }
  .person.own { border-color: rgba(115, 201, 157, 0.55); }
  .person.plat { border-color: rgba(138, 180, 248, 0.6); } .person.plat img { border-color: rgba(138, 180, 248, 0.75); } .person.plat .k2 { color: #9fc2fb; }
  .card.sad .k2 { color: var(--amber); }
  .path { width: 404px; padding: 16px 18px; }
  .path .top { display: flex; justify-content: space-between; align-items: center; }
  .path .tag { display: inline-block; padding: 7px 11px; border-radius: 999px; font: 800 14px/1 'Geist'; letter-spacing: 2.2px; text-transform: uppercase; }
  .path.happy .tag { background: rgba(52, 211, 128, 0.16); border: 1px solid rgba(115, 201, 157, 0.7); color: #bdf5d6; }
  .path.sad .tag { background: rgba(247, 192, 74, 0.14); border: 1px solid rgba(247, 192, 74, 0.7); color: #ffe2a3; }
  .path .ppl { margin-top: 14px; display: flex; gap: 10px; }
  .path .pp { width: 126px; text-align: center; opacity: 0; }
  .path .pp img { width: 64px; height: 64px; border-radius: 18px; object-fit: cover; border: 1.5px solid rgba(255, 255, 255, 0.2); }
  .path.happy .pp img { border-color: rgba(115, 201, 157, 0.6); } .path.sad .pp img { border-color: rgba(247, 192, 74, 0.6); }
  .path .pp b { display: block; margin-top: 7px; font: 650 14px/1.15 'Geist'; }
  .path .pp span { display: block; margin-top: 3px; font: 500 12.5px/1.2 'Geist'; color: var(--ink2); }
  .path .out { margin-top: 14px; display: flex; gap: 12px; align-items: baseline; opacity: 0; }
  .path .out b { font: 700 30px/1 'Bricolage Grotesque'; letter-spacing: -0.6px; font-variant-numeric: tabular-nums; }
  .path.happy .out b { color: #c9f7de; } .path.sad .out b { color: #ffe3a6; }
  .path .out span { font: 500 15px/1.3 'Geist'; color: var(--ink2); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grade"></div>
  <div id="world">
    <svg id="lines" width="1920" height="1080"></svg>
    <div id="ui"></div>
  </div>
</div>
<script src="icons.js"></script>
<script src="cast.js"></script>
</body>
</html>
