<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-219 · under the hood, cut 13</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root {
    --bg: #050806; --ink: #f1f7f3; --ink2: #b9cbc1; --ink3: #8a9c92; --g300: #73c99d; --g400: #3fb07b; --ring: #34d380;
    --amber: #f2b437; --amber2: #f7c04a; --red: #e55c4a; --blue: #8ab4f8; --blue2: #c9dcff; --violet: #c58af9; --orange: #ff9f45;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #labels, #ui, #lead, #panels { position: absolute; inset: 0; pointer-events: none; }
  #lead { overflow: visible; z-index: 8; }
  #panels { z-index: 10; }
  #ui { z-index: 12; }

  /* small labels at a part's place, sized by its depth */
  .node { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 9px 17px 9px 9px;
    border-radius: 17px; background: linear-gradient(180deg, rgba(16, 26, 21, 0.92), rgba(8, 14, 11, 0.92));
    border: 1.2px solid rgba(115, 201, 157, 0.32); white-space: nowrap; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55); opacity: 0; }
  .node .tile { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none;
    background: rgba(52, 211, 128, 0.12); color: var(--g300); border: 1px solid rgba(115, 201, 157, 0.25); }
  .node .tile svg { width: 20px; height: 20px; }
  .node b { display: block; font: 700 21px/1.05 'Bricolage Grotesque'; letter-spacing: -0.2px; color: var(--ink); }
  .node span { display: block; margin-top: 4px; font: 500 14.5px/1.15 'Geist'; color: var(--ink2); }
  .node.gcp .tile { background: rgba(138, 180, 248, 0.14); color: var(--blue2); border-color: rgba(138, 180, 248, 0.38); }
  .node.fire .tile { background: rgba(255, 159, 69, 0.14); color: #ffb470; border-color: rgba(255, 159, 69, 0.38); }
  .node.ok { border-color: rgba(52, 211, 128, 0.7); } .node.ok .tile { background: rgba(52, 211, 128, 0.2); color: #9ff0c4; }
  .node.ok b { font: 650 18px/1.05 var(--mono); letter-spacing: 0; }

  .agent { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 160px; opacity: 0; }
  .agent b { font: 650 21px/1 'Geist'; color: var(--ink); letter-spacing: -0.2px; padding: 6px 12px; border-radius: 10px;
    background: rgba(6, 11, 9, 0.86); border: 1px solid rgba(115, 201, 157, 0.24); text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9); }
  .agent .tier { font: 700 15px/1 'Geist'; padding: 6px 10px; border-radius: 999px; white-space: nowrap; opacity: 0; display: flex; gap: 6px; align-items: center; }
  .agent .tier svg { width: 14px; height: 14px; }
  .tier.pro { background: rgba(40, 24, 56, 0.95); border: 1.5px solid rgba(197, 138, 249, 0.85); color: #ead9ff; }
  .tier.flash { background: rgba(14, 26, 48, 0.95); border: 1.5px solid rgba(138, 180, 248, 0.85); color: var(--blue2); }
  .tier.rules { background: rgba(14, 26, 20, 0.95); border: 1.5px solid rgba(115, 201, 157, 0.7); color: var(--g300); }

  .topic { position: absolute; left: 0; top: 0; font: 600 17px/1 var(--mono); padding: 8px 12px; border-radius: 10px;
    background: rgba(7, 14, 11, 0.94); border: 1.4px solid rgba(115, 201, 157, 0.6); color: #c6f7dc; white-space: nowrap; opacity: 0; }
  .pill { position: absolute; left: 0; top: 0; display: flex; gap: 8px; align-items: center; font: 650 16px/1 'Geist'; padding: 8px 13px; border-radius: 999px;
    white-space: nowrap; opacity: 0; background: rgba(7, 13, 10, 0.92); border: 1.2px solid rgba(115, 201, 157, 0.4); color: #cfe9db; }
  .pill svg { width: 16px; height: 16px; color: var(--g300); }
  .pill.blue { border-color: rgba(138, 180, 248, 0.55); color: #c9dcff; } .pill.blue svg { color: var(--blue); }
  .pill.big { font-size: 19px; padding: 10px 16px; gap: 9px; } .pill.big svg { width: 19px; height: 19px; }
  /* Gemini's two models, riding its orbits */
  .sat { position: absolute; left: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: 8px 13px 8px 9px; border-radius: 999px; white-space: nowrap; opacity: 0;
    font: 700 17px/1 'Geist'; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55); }
  .sat svg { width: 17px; height: 17px; }
  .sat.pro { background: rgba(34, 18, 52, 0.94); border: 1.6px solid rgba(197, 138, 249, 0.9); color: #f0e2ff; }
  .sat.flash { background: rgba(12, 24, 48, 0.94); border: 1.6px solid rgba(138, 180, 248, 0.9); color: #dbe8ff; }

  /* the act's title: over the scene, on its own shade, the words that matter marked */
  #shade { position: absolute; left: 0; top: 0; width: 1100px; height: 300px; z-index: 18; pointer-events: none;
    background: radial-gradient(120% 100% at 0% 0%, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.5) 38%, rgba(0, 0, 0, 0) 72%); opacity: 0; }
  .ttl { position: absolute; left: 72px; top: 50px; z-index: 21; opacity: 0; }
  .ttl .k { font: 700 15px/1 'Geist'; letter-spacing: 3.4px; text-transform: uppercase; color: var(--g300); display: flex; gap: 12px; align-items: center; }
  .ttl .k i { width: 9px; height: 9px; border-radius: 50%; background: var(--ring); }
  .ttl .k em { font-style: normal; color: var(--ink3); letter-spacing: 2px; }
  .ttl h1 { margin: 14px 0 0; font: 700 56px/1.02 'Bricolage Grotesque'; letter-spacing: -1.2px; color: #fff; white-space: nowrap;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75); }
  .ttl h1 .w { display: inline-block; position: relative; }
  .ttl h1 .w.hl { padding: 0 2px; }
  .ttl h1 .w.hl .b { display: inline-block; }
  .ttl h1 .w.hl .ink { position: absolute; left: 2px; top: 0; display: inline-block; color: #062014; text-shadow: none; white-space: nowrap; }
  .ttl h1 .mk { position: absolute; left: -8px; right: -8px; top: 6px; bottom: -2px; border-radius: 10px; background: linear-gradient(100deg, #5fe3a1, #34d380 60%, #2fc2a0);
    transform-origin: 0 50%; z-index: -1; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }

  /* the stack's parts, a glass dock along the foot */
  #index { position: absolute; left: 50%; bottom: 30px; z-index: 21; display: flex; gap: 6px; opacity: 0; padding: 7px; border-radius: 999px;
    transform: translateX(-50%); background: rgba(5, 10, 8, 0.76); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(16px) saturate(1.2); }
  .ix { display: flex; align-items: center; gap: 7px; padding: 9px 13px 9px 10px; border-radius: 999px; font: 600 15.5px/1 'Geist';
    color: #a3b4ab; white-space: nowrap; border: 1px solid transparent; }
  .ix svg { width: 16px; height: 16px; }
  .ix.done { color: #e3efe8; } .ix.done svg { color: var(--g300); }
  .ix.on { color: #04150c; background: linear-gradient(180deg, #6ef0ad, #34d380); border-color: rgba(255, 255, 255, 0.35);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); font-weight: 700; }
  .ix.on svg { color: #04150c; }

  /* a panel: the part's card over the app's own screens */
  .panel { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; gap: 16px; opacity: 0; will-change: transform, opacity; }
  .panel.side { flex-direction: row; align-items: flex-end; }
  .panel.side .hd { width: 420px; align-self: flex-start; }
  .panel .devs { display: flex; gap: 22px; align-items: flex-end; }
  .panel .hd { position: relative; }
  .panel.side.r { flex-direction: row-reverse; }
  .panel.side .hd .head { width: 420px; box-sizing: border-box; }
  .panel.grid .devs { flex-wrap: wrap; width: 822px; }
  .panel.grid .url { min-width: 0; font-size: 12.5px; padding: 4px 10px; }
  .panel.solo { width: 600px; }
  .panel.solo .head h2 { font-size: 64px; letter-spacing: -1.6px; }
  .head { padding: 18px 22px 18px 20px; border-radius: 20px; background: linear-gradient(180deg, rgba(12, 22, 17, 0.9), rgba(6, 12, 9, 0.9));
    border: 1.3px solid color-mix(in srgb, var(--tone) 55%, transparent); box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px); top: 0; left: 0; right: 0; }
  .head .k { display: flex; gap: 9px; align-items: center; font: 700 14px/1 'Geist'; letter-spacing: 2.4px; text-transform: uppercase; color: var(--tone); }
  .head .k svg { width: 18px; height: 18px; }
  .head h2 { margin: 9px 0 0; font: 700 40px/1.04 'Bricolage Grotesque'; letter-spacing: -0.8px; color: #fff; }
  .head p { margin: 9px 0 0; font: 500 19px/1.34 'Geist'; color: var(--ink2); }
  .head p b { color: #fff; font-weight: 650; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--tone) 38%, transparent) 62%); }
  .head .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 7px; }
  .head .chips span { font: 600 14px/1 var(--mono); padding: 7px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: #dcebe3; white-space: nowrap; }
  .bdg { position: absolute; left: 0; right: 0; bottom: -64px; display: flex; gap: 10px; justify-content: center; }
  .badge { display: flex; gap: 10px; align-items: center; padding: 10px 16px 10px 10px; border-radius: 999px; white-space: nowrap;
    background: rgba(6, 12, 9, 0.94); border: 1.5px solid var(--tone); color: #f1f7f3; font: 600 17px/1.15 'Geist';
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6); }
  .badge .bi { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tone) 22%, transparent); color: var(--tone); flex: none; }
  .badge .bi svg { width: 17px; height: 17px; }
  .badge code { font: 600 15px/1 var(--mono); color: #c6f7dc; }
  .badge em { font-style: normal; color: var(--tone); }

  .dv { position: relative; flex: none; box-shadow: 0 34px 90px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .dv .scr { position: relative; overflow: hidden; background: #f4f7f5; }
  .dv .scr img { position: absolute; left: 0; top: 0; max-width: none; }
  .dv.browser { border-radius: 14px; overflow: hidden; background: #e9eeeb; }
  .dv.browser .bar { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 14px; background: linear-gradient(#f3f6f4, #e6ebe8); border-bottom: 1px solid #d3dad6; }
  .dv.browser .bar i { width: 11px; height: 11px; border-radius: 50%; background: #e5534b; } .dv.browser .bar i:nth-child(2) { background: #e8b130; } .dv.browser .bar i:nth-child(3) { background: #3fb950; }
  .dv.browser .url { margin: 0 auto; display: flex; gap: 7px; align-items: center; padding: 5px 14px; border-radius: 8px; background: #fff; border: 1px solid #d7ded9;
    font: 500 14px/1 'Geist'; color: #2b3a33; min-width: 300px; justify-content: center; }
  .dv.browser .url svg { width: 13px; height: 13px; color: #6b7c73; }
  .dv.phone { border-radius: 52px; padding: 9px; background: linear-gradient(145deg, #2a302d, #0b0e0c 40%, #1a1f1c); box-shadow: 0 34px 90px rgba(0, 0, 0, 0.7), inset 0 0 0 1.5px rgba(255, 255, 255, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.9); }
  .dv.phone .scr { border-radius: 43px; }
  .typed { position: absolute; z-index: 5; display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  .typed .caret { display: inline-block; width: 2px; margin-left: 1px; background: #1a7a4c; }
  .ov { position: absolute; display: flex; align-items: center; justify-content: center; gap: 0.45em; font-family: 'Geist'; font-weight: 600; white-space: nowrap; }
  .ov .spin { display: inline-flex; }
  .veil { position: absolute; z-index: 4; }
  .typed, .ov, .push, .ring, .strip { z-index: 5; }
  .push { position: absolute; border-radius: 0; }
  .ring { position: absolute; border: 3px solid; }
  .strip { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 12px; align-items: center; padding: 11px 16px; border-radius: 12px;
    background: rgba(8, 16, 12, 0.94); color: #e6f2ec; font: 600 15px/1 var(--mono); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45); white-space: nowrap; }
  .strip .m { padding: 4px 7px; border-radius: 6px; background: rgba(138, 180, 248, 0.2); color: #c9dcff; }
  .strip .ok { color: #6ef0ad; } .strip .dim { color: #8fa59a; }
  .cur { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 9; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45)); }
  .tap { position: absolute; left: 0; top: 0; border-radius: 50%; z-index: 9; background: rgba(255, 255, 255, 0.45); border: 2.5px solid #fff; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35); }
  .rip { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px solid; z-index: 8; }
  .pk { position: absolute; left: 0; top: 0; z-index: 9; display: flex; gap: 7px; align-items: center; padding: 7px 11px; border-radius: 9px; background: rgba(6, 12, 9, 0.95);
    border: 1.4px solid var(--tone); color: #fff; font: 650 15px/1 var(--mono); white-space: nowrap; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6); }
  .pk svg { width: 15px; height: 15px; color: var(--tone); }
</style>
