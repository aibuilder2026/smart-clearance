<title>SC-84 Console · the first stock export</title>
<meta name="description" content="The console for SC-84: a client's first stock export set up by staff, so its workspace's Setup opens mapped; A a step in New client, B on Supply chain, C as a connector.">
<meta name="robots" content="noindex">
<script>
  // every load starts from the seed, signed in as Neha; ?opt=a|b|c, ?moment=waiting|uploading|mapping|mapped, ?step=, ?sheet=1; ?theme= from the board
  (function () {
    var p = new URLSearchParams(location.search), q = p.get("theme"), opt = p.get("opt") || "a";
    try {
      localStorage.removeItem("sc3-platform");
      localStorage.setItem("sc3-console-session", JSON.stringify({ uid: "neha", at: Date.now() }));
      if (q === "dark" || q === "light") localStorage.setItem("sc3-theme", q);
    } catch (e) {}
    if (!location.hash) history.replaceState(null, "", location.pathname + location.search + (opt === "a" ? "#/new-client" : opt === "b" ? "#/clients/kesari/supply" : "#/clients/kesari/integrations"));
    var mode = q; try { mode = localStorage.getItem("sc3-theme") || q; } catch (e) {}
    var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
  window.SC3_IMG = "../../../system/img/"; window.SC3_SITE_IMG = "../../../site/assets/plates/";
  window.SC3_LINKS = { site: "../../../site/Smart-Clearance%20site%20v3.html", app: "../../../app/Smart-Clearance%20app%20v3.html", demo: "../../../demo/Smart-Clearance%20demo%20v3.html" };
</script>
