<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-218 · under the hood</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root {
    --bg: #070b09; --ink: #ecf3ef; --ink2: #aabcb2; --ink3: #7a8c82; --g300: #73c99d; --g400: #3fb07b; --ring: #34d380;
    --amber: #f2b437; --amber2: #f7c04a; --red: #e55c4a; --blue: #8ab4f8; --blue2: #c9dcff; --violet: #c58af9; --orange: #ff9f45;
  }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #world { position: absolute; left: 0; top: 0; width: 3200px; height: 1950px; transform-origin: 0 0; }
  #world svg { position: absolute; left: 0; top: 0; overflow: visible; }
  #chips, #ui { position: absolute; inset: 0; }
  #dim { position: absolute; inset: 0; background: #050806; opacity: 0; }
  /* a dark fade under the header, so what passes beneath it never fights its words */
  #scrim { position: absolute; left: 0; top: 0; width: 1920px; height: 330px; pointer-events: none;
    background: linear-gradient(180deg, rgba(5, 9, 7, 0.96) 0%, rgba(5, 9, 7, 0.86) 45%, rgba(5, 9, 7, 0) 100%); }
  .fig { margin-top: 18px; display: inline-flex; align-items: baseline; gap: 8px; padding: 12px 16px; border-radius: 14px; font: 500 18px/1 'Geist';
    background: rgba(52, 211, 128, 0.10); border: 1px solid rgba(115, 201, 157, 0.45); color: var(--ink2); opacity: 0; transform-origin: 0 50%; }
  .fig b { font: 700 30px/1 'Bricolage Grotesque'; color: #bdf5d6; letter-spacing: -0.4px; }
  .fig span { font-size: 15px; color: var(--ink3); margin-left: 4px; }

  /* a node of the architecture: upright over the plane, sized by its depth */
  .node { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 14px; padding: 13px 22px 13px 13px;
    border-radius: 22px; background: linear-gradient(180deg, rgba(20, 30, 25, 0.95), rgba(12, 18, 15, 0.95));
    border: 1.5px solid rgba(115, 201, 157, 0.28); transform-origin: 50% 50%; white-space: nowrap;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); opacity: 0; }
  .node .tile { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; flex: none;
    background: rgba(52, 211, 128, 0.12); color: var(--g300); border: 1px solid rgba(115, 201, 157, 0.25); }
  .node .tile svg { width: 26px; height: 26px; }
  .node b { display: block; font: 700 27px/1.05 'Bricolage Grotesque'; letter-spacing: -0.3px; color: var(--ink); }
  .node span { display: block; margin-top: 5px; font: 500 17px/1.15 'Geist'; color: var(--ink2); }
  .node.fire .tile { background: rgba(255, 159, 69, 0.14); color: #ffb470; border-color: rgba(255, 159, 69, 0.38); }
  .node.gcp .tile { background: rgba(138, 180, 248, 0.14); color: var(--blue2); border-color: rgba(138, 180, 248, 0.38); }
  .node.gem { border-color: rgba(197, 138, 249, 0.5); box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 70px rgba(197, 138, 249, 0.18); }
  .node.gem .tile { background: linear-gradient(135deg, rgba(138,180,248,0.22), rgba(197,138,249,0.22)); color: #e3d4ff; border-color: rgba(197, 138, 249, 0.5); }
  .node.big b { font-size: 33px; } .node.big .tile { width: 60px; height: 60px; } .node.big .tile svg { width: 31px; height: 31px; }
  .node .halo { position: absolute; inset: -46px; border-radius: 70px; opacity: 0; z-index: -1;
    background: radial-gradient(closest-side, rgba(52, 211, 128, 0.42), rgba(52, 211, 128, 0) 72%); }
  .node.gem .halo { background: radial-gradient(closest-side, rgba(197, 138, 249, 0.45), rgba(197, 138, 249, 0) 72%); }

  .agent { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 9px; width: 132px;
    transform-origin: 50% 50%; opacity: 0; }
  .agent .tile { width: 66px; height: 66px; border-radius: 19px; display: grid; place-items: center;
    background: linear-gradient(180deg, rgba(22, 34, 28, 0.98), rgba(12, 18, 15, 0.98)); color: var(--g300);
    border: 1.5px solid rgba(115, 201, 157, 0.35); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); }
  .agent .tile svg { width: 32px; height: 32px; }
  .agent b { font: 650 21px/1 'Geist'; color: var(--ink); letter-spacing: -0.2px; }
  .agent .tier { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); font: 700 16px/1 'Geist'; padding: 7px 11px;
    border-radius: 999px; white-space: nowrap; opacity: 0; display: flex; gap: 6px; align-items: center; letter-spacing: 0.2px; }
  .agent .tier svg { width: 15px; height: 15px; }
  .agent .tier.pro { background: rgba(40, 24, 56, 0.95); border: 1.5px solid rgba(197, 138, 249, 0.75); color: #ead9ff; box-shadow: 0 0 26px rgba(197, 138, 249, 0.35); }
  .agent .tier.flash { background: rgba(14, 26, 48, 0.95); border: 1.5px solid rgba(138, 180, 248, 0.75); color: var(--blue2); box-shadow: 0 0 26px rgba(138, 180, 248, 0.3); }
  .agent .tier.rules { background: rgba(14, 26, 20, 0.95); border: 1.5px solid rgba(115, 201, 157, 0.6); color: var(--g300); }
  .agent .glow { position: absolute; left: 50%; top: 38px; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; opacity: 0; z-index: -1;
    background: radial-gradient(closest-side, rgba(52, 211, 128, 0.5), rgba(52, 211, 128, 0) 72%); }
  .agent.pro .glow { background: radial-gradient(closest-side, rgba(197, 138, 249, 0.5), rgba(197, 138, 249, 0) 72%); }
  .agent.flash .glow { background: radial-gradient(closest-side, rgba(138, 180, 248, 0.5), rgba(138, 180, 248, 0) 72%); }

  .topic { position: absolute; left: 0; top: 0; font: 600 19px/1 ui-monospace, 'SF Mono', Menlo, monospace; padding: 9px 14px; border-radius: 12px;
    background: rgba(9, 16, 13, 0.95); border: 1.5px solid rgba(115, 201, 157, 0.45); color: #bdf5d6; white-space: nowrap; opacity: 0;
    box-shadow: 0 0 24px rgba(52, 211, 128, 0.22); }
  .pill { position: absolute; left: 0; top: 0; font: 650 17px/1 'Geist'; padding: 8px 13px; border-radius: 999px; white-space: nowrap; opacity: 0;
    background: rgba(9, 14, 12, 0.94); border: 1.2px solid rgba(255, 255, 255, 0.16); color: var(--ink2); }

  /* the act's header, top left */
  .hdr { position: absolute; left: 72px; top: 62px; opacity: 0; }
  .hdr .k { font: 700 16px/1 'Geist'; letter-spacing: 3px; text-transform: uppercase; color: var(--g300); display: flex; gap: 12px; align-items: center; }
  .hdr .k i { width: 9px; height: 9px; border-radius: 50%; background: var(--ring); box-shadow: 0 0 14px var(--ring); }
  .hdr h1 { margin: 14px 0 0; font: 700 58px/1.02 'Bricolage Grotesque'; letter-spacing: -1px; color: var(--ink); }
  .hdr p { margin: 12px 0 0; font: 500 22px/1.3 'Geist'; color: var(--ink2); }
  .frame-label { position: absolute; left: 0; top: 0; font: 700 18px/1 'Geist'; letter-spacing: 2.4px; text-transform: uppercase; color: #a9c8ff; opacity: 0; white-space: nowrap;
    display: flex; gap: 10px; align-items: center; }
  .frame-label svg { width: 22px; height: 22px; }

  /* act 3: one model call, bounded */
  #call { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; }
  .step { position: absolute; top: 300px; width: 382px; height: 420px; padding: 26px 26px 22px; border-radius: 26px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(20, 30, 25, 0.97), rgba(11, 17, 14, 0.97)); border: 1.5px solid rgba(115, 201, 157, 0.30);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); opacity: 0; }
  .step .n { font: 700 15px/1 'Geist'; letter-spacing: 2px; text-transform: uppercase; color: var(--g300); display: flex; gap: 10px; align-items: center; }
  .step .n svg { width: 22px; height: 22px; }
  .step h3 { margin: 16px 0 14px; font: 700 31px/1.08 'Bricolage Grotesque'; letter-spacing: -0.4px; }
  .step .li { display: flex; gap: 10px; align-items: flex-start; margin-top: 11px; font: 500 19px/1.3 'Geist'; color: var(--ink2); opacity: 0; }
  .step .li svg { width: 20px; height: 20px; flex: none; margin-top: 2px; color: var(--g300); }
  .step .li.no svg { color: var(--red); }
  .step .li.blue svg { color: var(--blue); }
  .step.gem { border-color: rgba(197, 138, 249, 0.55); box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 80px rgba(197, 138, 249, 0.14); }
  .step.gem .n { color: #d9bdff; }
  .step.yes { border-color: rgba(247, 192, 74, 0.55); box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 80px rgba(247, 192, 74, 0.14); }
  .step.yes .n { color: var(--amber2); }
  .btn { margin-top: 26px; font: 700 21px/1 'Geist'; padding: 17px 20px; border-radius: 15px; display: flex; gap: 10px; align-items: center; justify-content: center;
    background: var(--amber2); color: #1d1404; position: relative; }
  .btn svg { width: 21px; height: 21px; }
  .btn.done { background: var(--ring); color: #062114; }
  .arrow { position: absolute; top: 498px; width: 46px; height: 24px; opacity: 0; color: var(--g300); }
  .json { margin-top: 14px; font: 500 16px/1.42 ui-monospace, 'SF Mono', Menlo, monospace; color: #cfe3ff; background: rgba(8, 14, 24, 0.9);
    border: 1px solid rgba(138, 180, 248, 0.3); border-radius: 12px; padding: 12px 14px; white-space: pre; opacity: 0; }
  .json .k { color: #9ecbff; } .json .s { color: #bdf5d6; } .json .v { color: #ffd27a; }
  .lockchip { position: absolute; left: 0; top: 0; display: flex; gap: 12px; align-items: center; padding: 13px 20px 13px 14px; border-radius: 999px;
    background: rgba(32, 12, 10, 0.94); border: 1.5px solid rgba(229, 92, 74, 0.6); color: #ffd0c8; font: 650 21px/1 'Geist'; opacity: 0; white-space: nowrap;
    box-shadow: 0 0 40px rgba(229, 92, 74, 0.2); }
  .lockchip .bi { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(229, 92, 74, 0.18); color: #ff9c8c; }
  .lockchip svg { width: 20px; height: 20px; }
  .evals { position: absolute; left: 0; top: 0; display: flex; gap: 14px; align-items: center; opacity: 0; }
  .evals .e { font: 600 18px/1 'Geist'; padding: 11px 16px; border-radius: 999px; background: rgba(10, 16, 13, 0.92); border: 1px solid rgba(115, 201, 157, 0.3); color: var(--ink2); white-space: nowrap; }
  .evals .e b { color: var(--ink); font-weight: 700; }
  .evals .lead { font: 700 15px/1 'Geist'; letter-spacing: 2.2px; text-transform: uppercase; color: var(--g300); margin-right: 4px; }
  .node.ghost, .agent.ghost { filter: grayscale(0.85); box-shadow: none; }
  .pill.spec { display: flex; gap: 8px; align-items: center; border-color: rgba(115, 201, 157, 0.35); color: #cfe9db; background: rgba(8, 15, 12, 0.92); }
  .pill.spec svg { width: 16px; height: 16px; color: var(--g300); }
  .pkd { position: absolute; left: 0; top: 0; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #d8ffe9; box-shadow: 0 0 14px 4px rgba(52, 211, 128, 0.7); }
  .trace { position: absolute; left: 1150px; top: 770px; width: 674px; padding: 20px 24px 16px; border-radius: 20px; opacity: 0;
    background: linear-gradient(180deg, rgba(16, 24, 21, 0.96), rgba(10, 15, 13, 0.96)); border: 1px solid rgba(138, 180, 248, 0.32); box-shadow: 0 24px 70px rgba(0,0,0,0.55); }
  .trace .tk { font: 700 14px/1 'Geist'; letter-spacing: 2px; text-transform: uppercase; color: #a9c8ff; display: flex; gap: 9px; align-items: center; margin-bottom: 12px; }
  .trace .tk svg { width: 17px; height: 17px; }
  .trace .tr { display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 12px; padding: 6px 0; font: 500 16px/1 ui-monospace, 'SF Mono', Menlo, monospace; color: var(--ink2); }
  .trace .tr > i { position: relative; display: block; height: 14px; }
  .trace .tr > i { background: none; }
  .trace .tr { position: relative; }
  .trace .tr i { position: relative; height: 14px; border-radius: 4px; }
  .trace .tr i.g { background: linear-gradient(90deg, #2bbf74, #73c99d); }
  .trace .tr i.v { background: linear-gradient(90deg, #a46cf0, #c58af9); }
  .trace .tr i.b { background: linear-gradient(90deg, #5f8fe6, #8ab4f8); }
  .cursor { position: absolute; left: 0; top: 0; z-index: 30; width: 34px; height: 34px; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55)); }
  .ripple { position: absolute; left: 0; top: 0; z-index: 29; border-radius: 50%; border: 3px solid var(--amber2); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="world"></div>
  <canvas id="glow" width="1920" height="1080" style="mix-blend-mode: screen"></canvas>
  <div id="chips"></div>
  <div id="dim"></div>
  <div id="scrim"></div>
  <div id="ui"></div>
</div>
<script src="icons.js"></script>
<script src="arch.js"></script>
</body>
</html>
