<script>
  // the workspace on its stub, with the story run to the end, signed in as ?who= (anita by default, or vikram);
  // ?theme= picks light or dark; #/report/<ref> opens a batch's page
  (function () {
    var q = new URLSearchParams(location.search);
    try {
      if (q.get("theme")) localStorage.setItem("sc3-theme", q.get("theme"));
      localStorage.setItem("sc3-session", JSON.stringify({ uid: q.get("who") || "anita", at: Date.now() }));
    } catch (e) {}
    if (!location.hash) history.replaceState(null, "", location.pathname + location.search + "#/report");
  })();
</script>
