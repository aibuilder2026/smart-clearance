<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-211 · every team, its own part</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root { --ink: #ecf3ef; --ink2: #aabcb2; --g300: #73c99d; --ring: #34d380; --amber2: #f7c04a; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070b09;
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #view { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 42%; }
  #world { position: absolute; left: 0; top: 0; width: 3600px; height: 1080px; transform-origin: 0 0; transform-style: preserve-3d; }
  .dev { position: absolute; transform-origin: 50% 100%; -webkit-box-reflect: below 8px linear-gradient(transparent 78%, rgba(255,255,255,0.13)); }
  .frame { position: absolute; left: 0; top: 0; background: #111714; box-shadow: 0 0 0 2px #2b3530 inset, 0 40px 90px rgba(0,0,0,0.6); }
  .screen { position: absolute; overflow: hidden; background: #f4f7f5; }
  .screen img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .lap .frame { width: 1000px; height: 650px; border-radius: 24px; } .lap .screen { left: 16px; top: 16px; width: 968px; height: 618px; border-radius: 10px; }
  .lap .deck { position: absolute; left: -66px; top: 650px; width: 1132px; height: 22px; border-radius: 0 0 20px 20px; background: linear-gradient(180deg, #3a443f, #1b221e); }
  .tab .frame { width: 470px; height: 662px; border-radius: 36px; } .tab .screen { left: 18px; top: 18px; width: 434px; height: 626px; border-radius: 20px; }
  .ph .frame { width: 300px; height: 634px; border-radius: 48px; } .ph .screen { left: 12px; top: 12px; width: 276px; height: 610px; border-radius: 38px; }
  .glare { position: absolute; inset: -10%; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.22) 47%, rgba(255,255,255,0.05) 53%, rgba(255,255,255,0) 62%); }
  .role { position: absolute; display: flex; align-items: center; gap: 14px; padding: 14px 22px 14px 14px; border-radius: 20px; white-space: nowrap;
    background: rgba(10, 16, 13, 0.9); border: 1px solid rgba(115, 201, 157, 0.35); box-shadow: 0 20px 50px rgba(0,0,0,0.5); opacity: 0; transform-origin: 50% 0; }
  .role .orb { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgba(52, 211, 128, 0.12); color: var(--g300); border: 1px solid rgba(52,211,128,0.4); }
  .role .orb svg { width: 25px; height: 25px; }
  .role b { display: block; font: 700 25px/1.1 'Bricolage Grotesque'; letter-spacing: -0.2px; }
  .role span { display: block; margin-top: 4px; font: 500 16px/1.2 'Geist'; color: var(--ink2); }
  .kick { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font: 700 15px/1 'Geist'; letter-spacing: 3px; text-transform: uppercase; color: var(--g300); opacity: 0; }
  .h1 { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font: 700 58px/1.05 'Bricolage Grotesque'; letter-spacing: -1px; opacity: 0; white-space: nowrap; }
  .lock { position: absolute; display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; font: 600 14px/1 'Geist'; color: #c9dcff;
    background: rgba(9, 14, 12, 0.92); border: 1px solid rgba(138, 180, 248, 0.45); opacity: 0; white-space: nowrap; }
  .lock svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<canvas id="bg" width="1920" height="1080"></canvas>
<div id="view"><div id="world"></div></div>
<canvas id="fx" width="1920" height="1080" style="mix-blend-mode: screen"></canvas>
<div id="ui"></div>
<script src="icons.js"></script>
<script src="teams.js"></script>
</body>
</html>
