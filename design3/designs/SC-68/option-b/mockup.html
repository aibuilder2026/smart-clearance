<script>
  // ?theme= from the board (or the reader's own appearance, sc3-theme); ?state= picks the scenario; ?shot=1 holds it still
  (function () {
    var p = new URLSearchParams(location.search), q = p.get("theme"), mode = q;
    try { if (q === "dark" || q === "light") localStorage.setItem("sc3-theme", q); mode = localStorage.getItem("sc3-theme") || q; localStorage.setItem("sc3-hero-paused", p.get("shot") === "1" ? "1" : "0"); } catch (e) {}
    var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
  window.SC3_IMG = "../../../system/img/";
</script>
