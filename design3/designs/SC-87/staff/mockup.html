<style>
  /* SC-87's mockups: the distributor's phone beside the operator's Execution, each on the real kit */
  /* above the kit's ground (AppRoot's background layer, positioned) */
  .s87 { position: relative; z-index: 1; display: grid; gap: 28px; padding: 28px; align-items: start; }
  .s87.both { grid-template-columns: 390px minmax(0, 1fr); }
  .s87-phone { border: 1px solid var(--line); border-radius: 28px; padding: 22px 16px 28px; background: var(--bg-2, var(--bg)); }
  .s87.dist, .s87.ops { padding: 16px; }
  .s87.dist .s87-phone { border: 0; padding: 4px 0 24px; border-radius: 0; background: none; }
  @media (max-width: 900px) { .s87.both { grid-template-columns: minmax(0, 1fr); } }
</style>
