<script>
  // the demo's console: Neha's session (unless ?signin=1, for the sign-in beat), screens that read at once, and a world
  // of its own that is never saved, so the visitor's own prototype data is untouched; the theme follows ?theme=
  (function () {
    var q = new URLSearchParams(location.search);
    try {
      if (q.get("theme")) localStorage.setItem("sc3-theme", q.get("theme"));
      if (q.get("signin") === "1") localStorage.removeItem("sc3-console-session");
      else localStorage.setItem("sc3-console-session", JSON.stringify({ uid: "neha", at: Date.now() }));
    } catch (e) {}
    if (q.get("splash") !== "1") window.SC3_SPLASH_MANUAL = true;
    if (!q.get("read")) history.replaceState(null, "", location.pathname + "?read=1&boot=1&enter=1&leave=1" + (q.toString() ? "&" + q.toString() : "") + location.hash);
  })();
  window.SC3_IMG = /claudeusercontent\.com$/.test(location.hostname) ? "https://raw.githubusercontent.com/aibuilder2026/smart-clearance/__IMG_SHA__/design3/system/img/" : "../../system/img/";
  window.SC3_SITE_IMG = /claudeusercontent\.com$/.test(location.hostname) ? "https://raw.githubusercontent.com/aibuilder2026/smart-clearance/__IMG_SHA__/design3/site/assets/plates/" : "../../site/assets/plates/";
</script>
