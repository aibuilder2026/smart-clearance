<script>
  // every load starts from the seed, signed out unless ?signed=1 (?moment=enter|leave|console sign Neha in); ?theme= from the board
  (function () {
    var p = new URLSearchParams(location.search), q = p.get("theme"), m = p.get("moment");
    try {
      localStorage.removeItem("sc3-platform");
      if (p.get("signed") === "1" || m === "enter" || m === "leave" || m === "console") localStorage.setItem("sc3-console-session", JSON.stringify({ uid: "neha", at: Date.now() }));
      else localStorage.removeItem("sc3-console-session");
      localStorage.removeItem("sc3-console-live");
      if (q === "dark" || q === "light") localStorage.setItem("sc3-theme", q);
    } catch (e) {}
    var mode = q; try { mode = localStorage.getItem("sc3-theme") || q; } catch (e) {}
    var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
  window.SC3_IMG = "../../../system/img/"; window.SC3_SITE_IMG = "../../../site/assets/plates/";
