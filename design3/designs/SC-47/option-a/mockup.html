<title>SC-47 Option A · on each SKU</title>
<meta name="description" content="Quick-commerce gates per SKU, with a per-batch override, on Munchly Foods' Supply chain tab: option A.">
<script>
  // the reader's appearance (sc3-theme, as the console), or ?theme= from the board
  (function () {
    var p = new URLSearchParams(location.search), q = p.get("theme"), mode = null;
    try { if (q === "dark" || q === "light") localStorage.setItem("sc3-theme", q); mode = localStorage.getItem("sc3-theme"); } catch (e) { mode = q; }
    var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    window.SC47 = { dark: dark, option: "a" };
  })();
</script>
