<script>
  // the workspace on its stub, the story run to ?stage= (7 by default: the chips executing, the scheme open), signed in
  // as ?who= (rakesh, ganesh, shreesai, meera); ?theme= picks light or dark; ?fresh forgets a declined offer; the hash
  // opens a screen
  (function () {
    var q = new URLSearchParams(location.search);
    try {
      if (q.get("theme")) localStorage.setItem("sc3-theme", q.get("theme"));
      localStorage.setItem("sc3-session", JSON.stringify({ uid: q.get("who") || "rakesh", at: Date.now() }));
      if (q.has("fresh")) localStorage.removeItem("sc130-declined");
    } catch (e) {}
    window.SC130_STAGE = Number(q.get("stage") || 7);
    if (!location.hash) history.replaceState(null, "", location.pathname + location.search + "#/report");
  })();
</script>
