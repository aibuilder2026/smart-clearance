<style>
  /* SC-139's mockups: each frame on the real kit, above its ground */
  .g139 { position: relative; z-index: 1; padding: 28px; max-width: 760px; margin: 0 auto; }
  .g139.papers { max-width: 1240px; }
  .g139.review { max-width: 900px; }
  .g-who { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .g-who .g-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-600, #167a52); }
  .g-cam { aspect-ratio: 4 / 3; }
  .g-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .g-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .g-check { gap: 8px; align-items: flex-start; }
  .g-ok { color: var(--green-700, #13694a); flex: none; margin-top: 2px; }
  .g-warn { color: var(--amber-700, #9a5b00); flex: none; margin-top: 2px; }
  .g-papers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .g-radio { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); cursor: default; }
  .g-radio.on { border-color: var(--green-600, #167a52); background: var(--fill); }
  .g-ring { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong, #9aa5a0); flex: none; margin-top: 2px; }
  .g-ring.on { border: 5px solid var(--green-600, #167a52); }
  .g-rule-sub { margin-top: 6px; font-size: 13px; font-weight: 650; }
  .g139 .list-row .tnum { white-space: nowrap; text-align: right; }
  .g-steps { padding: 10px 12px; border-radius: 14px; background: var(--fill); }
  @media (max-width: 900px) { .g-papers, .g-split { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 520px) { .g139 { padding: 16px; } .g-two { grid-template-columns: minmax(0, 1fr); } }
</style>
