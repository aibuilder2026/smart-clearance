<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-211 · one audit trail</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root { --ink: #ecf3ef; --ink2: #aabcb2; --ink3: #7a8c82; --g300: #73c99d; --ring: #34d380; --amber2: #f7c04a; }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070b09;
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #world { position: absolute; left: 0; top: 0; width: 4200px; height: 1080px; transform-origin: 0 0; }
  .track { position: absolute; left: 120px; top: 538px; height: 4px; border-radius: 2px; background: rgba(115, 201, 157, 0.18); }
  .fill { position: absolute; left: 120px; top: 538px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #1f9563, #34d380); box-shadow: 0 0 18px rgba(52, 211, 128, 0.6); }
  .day { position: absolute; top: 566px; font: 600 15px/1 'Geist'; letter-spacing: 2px; text-transform: uppercase; color: var(--ink3); white-space: nowrap; }
  .pin { position: absolute; width: 0; height: 0; }
  .pin .orb { position: absolute; left: -27px; top: -27px; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
    background: #0d1a14; border: 2px solid rgba(52, 211, 128, 0.75); color: var(--g300); box-shadow: 0 0 26px rgba(52, 211, 128, 0.35); }
  .pin .orb svg { width: 26px; height: 26px; }
  .pin.person .orb { border-color: var(--amber2); color: var(--amber2); background: #1b1408; box-shadow: 0 0 30px rgba(247, 192, 74, 0.45); }
  .pin .stem { position: absolute; left: -1px; width: 2px; background: linear-gradient(180deg, rgba(115,201,157,0.6), rgba(115,201,157,0.05)); }
  .pin.person .stem { background: linear-gradient(180deg, rgba(247,192,74,0.75), rgba(247,192,74,0.05)); }
  .pin .card { position: absolute; left: -150px; width: 300px; padding: 14px 16px; box-sizing: border-box; border-radius: 16px;
    background: rgba(13, 20, 16, 0.92); border: 1px solid rgba(115, 201, 157, 0.28); box-shadow: 0 18px 40px rgba(0,0,0,0.45); }
  .pin.person .card { border-color: rgba(247, 192, 74, 0.5); box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 0 40px rgba(247,192,74,0.14); }
  .card .who { font: 700 19px/1.15 'Geist'; color: var(--ink); white-space: nowrap; }
  .pin.person .card .who { color: var(--amber2); }
  .card .what { margin-top: 6px; font: 400 16px/1.3 'Geist'; color: var(--ink2); }
  .card .when { margin-top: 9px; display: flex; gap: 7px; align-items: center; font: 600 14px/1 'Geist'; color: #9db5ff; font-variant-numeric: tabular-nums; }
  .card .when svg { width: 14px; height: 14px; }
  /* (SC-245: the title under YouTube's header, which covers the top of the frame) */
  .kick { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font: 700 15px/1 'Geist'; letter-spacing: 3px; text-transform: uppercase; color: var(--g300); opacity: 0; }
  .h1 { position: absolute; left: 0; right: 0; top: 224px; text-align: center; font: 700 58px/1.05 'Bricolage Grotesque'; letter-spacing: -1px; opacity: 0; white-space: nowrap; }
  .h1 em { font-style: normal; color: var(--amber2); }
  .doc { position: absolute; left: 610px; top: 300px; width: 700px; padding: 30px 34px; box-sizing: border-box; border-radius: 26px; opacity: 0;
    background: linear-gradient(180deg, rgba(20, 30, 25, 0.97), rgba(11, 17, 14, 0.97)); border: 1px solid rgba(115, 201, 157, 0.38);
    box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 90px rgba(52, 211, 128, 0.14); }
  .doc .k { display: flex; gap: 9px; align-items: center; font: 700 14px/1 'Geist'; letter-spacing: 1.8px; text-transform: uppercase; color: var(--g300); }
  .doc .k svg { width: 17px; height: 17px; }
  .doc h2 { margin: 12px 0 6px; font: 700 42px/1.05 'Bricolage Grotesque'; letter-spacing: -0.5px; }
  .doc p { margin: 0; font: 400 19px/1.4 'Geist'; color: var(--ink2); }
  .doc .rows { margin-top: 18px; display: grid; gap: 8px; }
  .doc .r { display: grid; grid-template-columns: 34px 120px 1fr; gap: 10px; align-items: center; font: 500 16px/1.2 'Geist'; color: var(--ink2); }
  .doc .r .d { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid rgba(52,211,128,0.7); color: var(--g300); }
  .doc .r .d svg { width: 14px; height: 14px; }
  .doc .r.p .d { border-color: var(--amber2); color: var(--amber2); }
  .doc .r .t { color: #9db5ff; font-weight: 600; font-variant-numeric: tabular-nums; }
  .doc .foot { display: flex; align-items: center; gap: 12px; margin-top: 22px; }
  .pill { display: flex; gap: 8px; align-items: center; padding: 9px 14px; border-radius: 999px; font: 600 15px/1 'Geist'; color: var(--ink); background: rgba(52,211,128,0.10); border: 1px solid rgba(52,211,128,0.35); }
  .pill svg { width: 16px; height: 16px; color: var(--ring); }
  .btn { margin-left: auto; display: flex; gap: 9px; align-items: center; padding: 13px 20px; border-radius: 14px; font: 700 18px/1 'Geist'; background: var(--ring); color: #062114; }
  .btn svg { width: 18px; height: 18px; }
  .done { position: absolute; display: flex; gap: 10px; align-items: center; padding: 12px 18px 12px 14px; border-radius: 999px; opacity: 0;
    background: rgba(10, 16, 13, 0.92); border: 1px solid rgba(52, 211, 128, 0.5); font: 600 18px/1 'Geist'; white-space: nowrap; }
  .done svg { width: 20px; height: 20px; color: var(--ring); }
  .cursor { position: absolute; left: 0; top: 0; z-index: 30; width: 34px; height: 34px; opacity: 0; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55)); }
  .ripple { position: absolute; left: 0; top: 0; z-index: 29; border-radius: 50%; border: 3px solid var(--ring); opacity: 0; }
</style>
</head>
<body>
<canvas id="bg" width="1920" height="1080"></canvas>
<div id="world"></div>
<canvas id="fx" width="1920" height="1080" style="mix-blend-mode: screen"></canvas>
<div id="ui"></div>
<script src="icons.js"></script>
<script src="audit.js"></script>
</body>
</html>
