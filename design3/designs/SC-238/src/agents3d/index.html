<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SC-238 · the agents, in 3D</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('/fonts/Bricolage.ttf'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist.ttf'); font-weight: 100 900; }
  :root {
    --ink: #f1f7f3; --ink2: #b9cbc1; --ink3: #8a9c92; --g300: #73c99d; --ring: #34d380; --mint: #5fe3a1;
    --amber: #f7c04a; --red: #ff7a66; --blue: #8ab4f8; --blue2: #c9dcff; --violet: #c58af9; --vio2: #ead9ff;
    --mono: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  #stems { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

  /* an agent's chip over its station, on a stem: its icon, its name, the stop, the model it thinks with */
  .chip { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(14, 24, 19, 0.93), rgba(7, 13, 10, 0.93)); border: 1.4px solid rgba(115, 201, 157, 0.35);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55); white-space: nowrap; opacity: 0; will-change: transform, opacity; }
  .chip .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none;
    background: rgba(52, 211, 128, 0.14); color: #9ff0c4; border: 1px solid rgba(52, 211, 128, 0.4); }
  .chip .ic svg { width: 24px; height: 24px; }
  .chip .k { font: 700 12.5px/1 'Geist'; letter-spacing: 2.2px; text-transform: uppercase; color: var(--g300); }
  .chip b { display: block; margin-top: 5px; font: 700 25px/1 'Bricolage Grotesque'; letter-spacing: -0.3px; color: var(--ink); }
  .chip .tier { margin-left: 4px; font: 700 14px/1 'Geist'; padding: 7px 10px; border-radius: 999px; display: flex; gap: 6px; align-items: center; }
  .chip .tier svg { width: 14px; height: 14px; }
  .tier.pro { background: rgba(40, 24, 56, 0.95); border: 1.5px solid rgba(197, 138, 249, 0.85); color: var(--vio2); }
  .tier.flash { background: rgba(14, 26, 48, 0.95); border: 1.5px solid rgba(138, 180, 248, 0.85); color: var(--blue2); }
  .tier.rules { background: rgba(14, 26, 20, 0.95); border: 1.5px solid rgba(115, 201, 157, 0.7); color: var(--g300); }
  .tier.you { background: rgba(48, 34, 8, 0.95); border: 1.5px solid rgba(247, 192, 74, 0.9); color: #ffe2a3; }
  .chip.amber { border-color: rgba(247, 192, 74, 0.6); } .chip.amber .ic { background: rgba(247, 192, 74, 0.16); color: #ffd98a; border-color: rgba(247, 192, 74, 0.5); }
  .chip.dim { filter: saturate(0.4); }
  .chip .tag { margin-left: 6px; font: 600 14px/1.2 'Geist'; color: #ffd0a8; padding: 6px 9px; border-radius: 9px; background: rgba(60, 30, 10, 0.9); border: 1px solid rgba(255, 159, 69, 0.5); }

  /* what the agent did, a card beside its chip: the real screen or the work's own figures */
  .card { position: absolute; left: 0; top: 0; padding: 14px 16px; border-radius: 18px; width: 360px; box-sizing: border-box;
    background: linear-gradient(180deg, rgba(12, 22, 17, 0.94), rgba(6, 12, 9, 0.94)); border: 1.3px solid rgba(115, 201, 157, 0.3);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.6); opacity: 0; will-change: transform, opacity; }
  .card h4 { margin: 0; font: 700 13px/1 'Geist'; letter-spacing: 2.2px; text-transform: uppercase; color: var(--g300); }
  .card p { margin: 8px 0 0; font: 600 21px/1.25 'Geist'; color: var(--ink); }
  .card .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; font: 600 18px/1.2 'Geist'; color: var(--ink); opacity: 0; }
  .card .row i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: rgba(52, 211, 128, 0.2); color: #9ff0c4; font-style: normal; }
  .card .row i svg { width: 14px; height: 14px; }
  .card .row.x i { background: rgba(255, 122, 102, 0.2); color: var(--red); }
  .card .row em { margin-left: auto; font: 650 17px/1 var(--mono); font-style: normal; color: var(--ink2); white-space: nowrap; }
  .card .fig { white-space: nowrap; }
  .card img { display: block; width: 100%; border-radius: 10px; margin-top: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  .card .bars { display: flex; gap: 10px; align-items: flex-end; height: 120px; margin-top: 12px; }
  .card .bar { flex: 1; border-radius: 6px 6px 2px 2px; position: relative; transform-origin: bottom; }
  .card .bar span { position: absolute; left: 50%; bottom: -24px; transform: translateX(-50%); font: 600 12.5px/1 'Geist'; color: var(--ink2); white-space: nowrap; }

  /* a rule along the rails */
  .rule { position: absolute; left: 0; top: 0; display: flex; gap: 9px; align-items: center; padding: 9px 14px 9px 10px; border-radius: 999px; white-space: nowrap; opacity: 0;
    background: rgba(32, 24, 6, 0.92); border: 1.4px solid rgba(247, 192, 74, 0.7); color: #ffe2a3; font: 650 18px/1 'Geist'; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); }
  .rule svg { width: 18px; height: 18px; color: var(--amber); }

  /* the act's title, top left, on its own shade */
  /* (SC-245: the act's title at the foot's right, clear of YouTube's header over the top of the frame) */
  #shade { position: absolute; right: 0; bottom: 0; width: 1300px; height: 440px; pointer-events: none;
    background: radial-gradient(120% 100% at 100% 100%, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.42) 40%, rgba(0, 0, 0, 0) 74%); opacity: 0; }
  .ttl { position: absolute; right: 96px; bottom: 150px; opacity: 0; text-align: right; }
  .ttl .k { font: 700 15px/1 'Geist'; letter-spacing: 3.4px; text-transform: uppercase; color: var(--g300); display: flex; gap: 12px; align-items: center; justify-content: flex-end; }
  .ttl .k i { width: 9px; height: 9px; border-radius: 50%; background: var(--ring); }
  .ttl h1 { margin: 14px 0 0; font: 700 58px/1.02 'Bricolage Grotesque'; letter-spacing: -1.2px; color: #fff; white-space: nowrap; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.75); }
  .ttl h1 .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: 12px; margin-bottom: -12px; }
  .ttl h1 .w > span { display: inline-block; }
  .ttl h1 .hl { color: #9ff0c4; }
  .ttl h1 .am { color: var(--amber); }

  /* the nine stops, a glass index along the foot */
  #idx { position: absolute; left: 50%; bottom: 92px; display: flex; gap: 6px; padding: 7px; border-radius: 999px; transform: translateX(-50%); opacity: 0;
    background: rgba(5, 10, 8, 0.78); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6); }
  .ix { display: flex; align-items: center; gap: 7px; padding: 9px 13px 9px 10px; border-radius: 999px; font: 600 15.5px/1 'Geist'; color: #8fa198; white-space: nowrap; border: 1px solid transparent; }
  .ix svg { width: 16px; height: 16px; }
  .ix b { font: 700 12px/1 var(--mono); color: inherit; opacity: 0.8; }
  .ix.done { color: #dce9e2; } .ix.done svg { color: var(--g300); }
  .ix.on { color: #04150c; background: linear-gradient(180deg, #6ef0ad, #34d380); border-color: rgba(255, 255, 255, 0.35); font-weight: 700; }
  .ix.on svg { color: #04150c; }
  .ix.on.amb { background: linear-gradient(180deg, #ffd77a, #f2b437); }

  /* SC-245: the roll-call, every agent on screen before the tour: ten cards rise in turn on "Ten agents", Gemini's beams
     land on the nine that think with it, the Watcher steps forward on "plain rules", then each card flies to its station */
  #roll { position: absolute; inset: 0; pointer-events: none; }
  #rshade { position: absolute; inset: 0; opacity: 0; background: radial-gradient(70% 60% at 50% 66%, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.3) 55%, rgba(0, 0, 0, 0) 100%); }
  #rfx { position: absolute; inset: 0; overflow: visible; }
  .rc { position: absolute; left: 0; top: 0; width: 164px; height: 214px; box-sizing: border-box; padding: 16px 12px 14px; border-radius: 22px;
    background: linear-gradient(180deg, rgba(17, 30, 23, 0.96), rgba(6, 12, 9, 0.96)); border: 1.5px solid rgba(115, 201, 157, 0.38);
    box-shadow: 0 26px 64px rgba(0, 0, 0, 0.62); display: flex; flex-direction: column; align-items: center; text-align: center;
    opacity: 0; overflow: hidden; will-change: transform, opacity; transform-origin: 50% 100%; }
  .rc .n { position: absolute; left: 13px; top: 12px; font: 700 12px/1 var(--mono); color: var(--ink3); letter-spacing: 0.5px; }
  .rc .ic { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; margin-top: 10px; flex: none; }
  .rc .ic svg { width: 32px; height: 32px; }
  .rc.pro .ic { background: rgba(197, 138, 249, 0.16); color: #e4ccff; border: 1px solid rgba(197, 138, 249, 0.55); }
  .rc.flash .ic { background: rgba(138, 180, 248, 0.16); color: #d6e5ff; border: 1px solid rgba(138, 180, 248, 0.55); }
  .rc.rules .ic { background: rgba(52, 211, 128, 0.16); color: #a8f2c9; border: 1px solid rgba(52, 211, 128, 0.55); }
  .rc b { margin-top: 13px; font: 700 22px/1.05 'Bricolage Grotesque'; color: #fff; letter-spacing: -0.3px; white-space: nowrap; }
  .rc .job { margin-top: 7px; font: 600 14px/1.25 'Geist'; color: var(--ink2); }
  .rc .tier { margin-top: auto; font: 700 13px/1 'Geist'; padding: 6px 9px; border-radius: 999px; display: flex; gap: 5px; align-items: center; white-space: nowrap; opacity: 0; }
  .rc .tier svg { width: 13px; height: 13px; }
  .rc .sh { position: absolute; top: -30px; bottom: -30px; left: 0; width: 56px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0)); }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<svg id="stems" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<div id="ov"></div>
<div id="roll"><div id="rshade"></div><svg id="rfx" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<div id="shade"></div>
<div id="ttl"></div>
<div id="idx"></div>
<script src="icons.js"></script>
<script type="module" src="./agents.js"></script>
</body>
</html>
