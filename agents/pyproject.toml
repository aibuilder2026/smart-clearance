[project]
name = "sc-agents"
version = "0.1.0"
description = "Smart-Clearance's agents: Google ADK pipelines on Gemini (Vertex AI) that read, explain, write and reply for backend-api's live journey."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "google-adk>=2.11,<2.12",
    "google-genai>=2.28,<3",
    "google-auth>=2.47",
    "fastapi>=0.141,<0.143",
    "uvicorn[standard]>=0.54,<0.55",
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "google-cloud-bigquery>=3.46,<3.47",
    "google-cloud-storage>=3.16,<3.17",
    "google-cloud-pubsub>=2.42,<2.43",
    # ADK 2.11 caps the OpenTelemetry SDK at 1.42.1, so the exporter and the instrumentations follow it
    "opentelemetry-sdk>=1.42,<=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42,<=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1,<0.64",
    "opentelemetry-instrumentation-httpx>=0.63b1,<0.64",
    "opentelemetry-instrumentation-requests>=0.63b1,<0.64",
    "weasyprint>=70,<71",
    "jinja2>=3.1,<3.2",
]

[project.scripts]
sc-agents-worker = "sc_agents.worker:main"
sc-agents-eval = "sc_agents.evals.run:main"
sc-agents-harvest = "sc_agents.evals.harvest:main"

[dependency-groups]
dev = [
    "ruff>=0.16.10,<0.17",
    "pytest>=9.1,<9.2",
    "pytest-asyncio>=1.4,<1.5",
    # the Vision eval's variants (evals/vision/build.py)
    "pillow>=12,<13",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# tests: fixtures' long literals, and a run's (outcome, context) pair where a test reads one of them
"tests/**" = ["S105", "S106", "S108", "E501", "RUF059"]
# table names come from a fixed list (TABLES); every value is a query parameter
"src/sc_agents/tools/bigquery.py" = ["S608"]
"src/sc_agents/evals/*.py" = ["S608"]
# the eval set's builder: seeded variants and its own paths
"evals/**" = ["S311", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # ADK 2.11 marks SequentialAgent and ParallelAgent deprecated in favour of Workflow, which cannot yet hold an
    # LlmAgent as a sub-agent; the pipelines use them as the architecture decided (README, "ADK")
    "ignore:.*is deprecated in favor of Workflow:DeprecationWarning",
]
