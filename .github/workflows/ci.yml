name: CI

# Lint, test and build the frontend on every change that can affect it; deploy both apps to Firebase Hosting from
# main (SC-40). prod is the only environment:
# - its credentials come through Workload Identity Federation, so no key exists (infra/prod/deployer.tf);
# - only main may deploy to it, and its variables are Terraform's (infra/prod/github.tf).

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'design3/**'
      - '!design3/designs/**'
      - '!design3/a11y/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'design3/**'
      - '!design3/designs/**'
      - '!design3/a11y/**'
      - 'infra/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main queue, so a deploy is never cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  frontend-gate:
    name: Frontend gate (lint, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - name: Lint (eslint, prettier)
        run: corepack pnpm lint
      - name: Type check (svelte-check)
        run: corepack pnpm check
      - name: Unit tests, and the seed and icons checks
        run: corepack pnpm test

  infra-gate:
    name: Infra gate (terraform fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: fmt, validate, and the scripts (bash -n, shellcheck)
        run: infra/scripts/check.sh

  build:
    name: Build both apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - name: Build the landing page and the console
        working-directory: frontend
        run: corepack pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          # stored as admin/build and console/build, under their common folder, frontend/
          path: |
            frontend/admin/build
            frontend/console/build
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Firebase Hosting (prod)
    needs: [frontend-gate, infra-gate, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: https://smartclearance.web.app
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token, exchanged for the deployer's Google credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: frontend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Release the build to both sites, then check each answers 200
        env:
          SKIP_BUILD: '1'
          HOSTING_SITES: ${{ vars.HOSTING_SITES }}
        run: infra/scripts/deploy.sh
