name: CI

# Lint, test and build the frontend, and lint and test backend-api against PostgreSQL 18 (SC-45), on every change
# that can affect them, with a secret scan. From main: backend-api is built, migrated and deployed to Cloud Run by
# Cloud Build when it changed (SC-50, backend-api/cloudbuild.yaml), then both apps are deployed to Firebase Hosting
# (SC-40). Once backend-api runs in the cloud, the apps are built against it (the PUBLIC_* repository variables).
# prod is the only environment:
# - its credentials come through Workload Identity Federation, so no key exists (infra/prod/deployer.tf, build.tf);
# - only main may deploy to it, and its variables are Terraform's (infra/prod/github.tf).

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'design3/**'
      - '!design3/designs/**'
      - '!design3/a11y/**'
      - 'infra/**'
      - 'backend-api/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'design3/**'
      - '!design3/designs/**'
      - '!design3/a11y/**'
      - 'infra/**'
      - 'backend-api/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main queue, so a deploy is never cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  frontend-gate:
    name: Frontend gate (lint, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - name: Lint (eslint, prettier)
        run: corepack pnpm lint
      - name: Type check (svelte-check)
        run: corepack pnpm check
      - name: Unit tests, and the seed and icons checks
        run: corepack pnpm test

  infra-gate:
    name: Infra gate (terraform fmt, validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: fmt, validate, and the scripts (bash -n, shellcheck)
        run: infra/scripts/check.sh

  backend-gate:
    name: Backend gate (ruff, pytest on PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-api
    services:
      postgres:
        image: postgres:18
        env:
          # a throwaway database for this job alone, reached only from it
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SC_ENV: test
      IDENTITY: fake
      DB_HOST: localhost
      DB_NAME: smart_clearance_test
      DB_USER: sc_api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend-api/uv.lock
      - name: The database and its logins, as db-init.sh makes them (passwords made here, for this job only)
        run: |
          app="$(openssl rand -hex 24)"; migrator="$(openssl rand -hex 24)"
          echo "::add-mask::$app"; echo "::add-mask::$migrator"
          { printf '\\set db smart_clearance_test\n\\set app_password %s\n\\set migrator_password %s\n' "$app" "$migrator"
            cat db/roles.sql db/init-local.sql; } | psql -h localhost -U postgres -d postgres -X -q -v ON_ERROR_STOP=1
          { echo "DB_PASSWORD=$app"; echo "TEST_MIGRATOR_PASSWORD=$migrator"; } >> "$GITHUB_ENV"
      - run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - name: Tests (pytest)
        run: uv run --frozen pytest -q

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1, checksum-verified (the action needs a licence for organisation repositories)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}~1..{0}', github.sha) }}
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts="$RANGE" .

  build:
    name: Build both apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - name: Build the landing page and the console
        working-directory: frontend
        # empty until backend-api runs in the cloud: the apps then use their in-browser mock
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
        run: corepack pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          # stored as admin/build and console/build, under their common folder, frontend/
          path: |
            frontend/admin/build
            frontend/console/build
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Deploy backend-api to Cloud Run (prod)
    needs: [infra-gate, backend-gate, secret-scan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
    concurrency:
      group: deploy-backend-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token, exchanged for github-backend's Google credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did backend-api change? (always, when run by hand)
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null ||
            [[ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- backend-api)" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.changed.outputs.backend == 'true' && vars.GCP_BACKEND_SERVICE_ACCOUNT != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BACKEND_SERVICE_ACCOUNT }}
      - name: Cloud Build builds, migrates and deploys it, as sc-builder
        if: steps.changed.outputs.backend == 'true' && vars.GCP_BACKEND_SERVICE_ACCOUNT != ''
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          BUILDER: ${{ vars.GCP_BUILDER_SERVICE_ACCOUNT }}
          BUCKET: ${{ vars.GCP_BUILD_BUCKET }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          id="$(gcloud builds submit backend-api --project="$PROJECT" --config=backend-api/cloudbuild.yaml --async --format='value(id)' \
            --service-account="$BUILDER" --gcs-source-staging-dir="gs://$BUCKET/source" \
            --substitutions="_REGION=$REGION,_TAG=${GITHUB_SHA::12}")"
          echo "Cloud Build $id: https://console.cloud.google.com/cloud-build/builds/$id"
          while :; do
            status="$(gcloud builds describe "$id" --project="$PROJECT" --format='value(status)')"
            case "$status" in
              SUCCESS) echo "backend-api ${GITHUB_SHA::12} is deployed"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "::error::Cloud Build $id: $status"; exit 1 ;;
            esac
            sleep 15
          done

  deploy:
    name: Deploy to Firebase Hosting (prod)
    needs: [frontend-gate, infra-gate, backend-gate, secret-scan, build, backend]
    # after backend-api, so the apps never reach an API older than they are
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod
      url: https://smartclearance.web.app
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token, exchanged for the deployer's Google credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: frontend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Release the build to both sites, then check each answers 200
        env:
          SKIP_BUILD: '1'
          HOSTING_SITES: ${{ vars.HOSTING_SITES }}
        run: infra/scripts/deploy.sh
