name: Set up the frontend
description: Node 24, pnpm through corepack (the version in frontend/package.json), the pnpm store cache, and the workspace's dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - id: store
      shell: bash
      working-directory: frontend
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: echo "path=$(corepack pnpm store path --silent)" >>"$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - shell: bash
      working-directory: frontend
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      run: corepack pnpm install --frozen-lockfile
